<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/styles/global.css" />
</head>

<body>
    <main>
        <div style="margin: 1rem;">

            <h1>TypeScript Calculator </h1>
            <table>
                <tr>
                    <td><label for="txFirst">First Number</label></td>
                    <td><input type="text" id="txFirst" class="bg-input"  title="First Number"/></td>
                </tr>
                <tr>
                    <td><label for="txSecond">Second Number</label></td>
                    <td><input type="text" id="txSecond" class="bg-input" title="Second Number"/></td>
                </tr>
                <tr>
                    <td><label for="cboOperation">Operation</label></td>
                    <td><select id="cboOperation" class="bg-input">
                        </select></td>
                </tr>
            </table>

            <div style="margin-top: 1rem;">
                <button id="btnCalc" type="button" class="bg-button">Calculate</button>
                <img id="imgWait"                
                src="src/images/ajax-loader.gif"
                style="width: 1.1rem; height: 1.1rem;"/>
            </div>

            <div style="margin-top: 1.5rem;">
                <span id="spResult"></span>
                
            </div>
        </div>
    </main>

    <!-- Loading scripts... -->
    <script type="module" src="dist/modules/constants.js"></script>
    <script type="module" src="dist/modules/htmlObjects.js"></script>
    <script type="module" src="dist/callback.js"></script>
</body>

</html>
